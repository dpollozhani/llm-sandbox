# Render Blueprint for data-analyst-assistant. Connect this repo on
# https://dashboard.render.com/blueprints (or use the "Deploy to Render"
# button in data-analyst-assistant/README.md) and Render auto-detects this
# file at the repo root.
#
# `rootDir` scopes the service to the subdirectory in this monorepo;
# `dockerfilePath`/`dockerContext` are then relative to it - matching
# deploy/docker/docker-compose.yml's `context: ../..` (i.e. the
# data-analyst-assistant/ directory).
services:
  - type: web
    name: data-analyst-assistant
    env: docker
    plan: free
    rootDir: data-analyst-assistant
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LOG_LEVEL
        value: INFO
      # Logs exactly what each orchestrator node changed, live during every
      # chat turn (LangGraph's own stream_mode="updates") - a debugging
      # aid, off by default since it's noisy for normal operation.
      - key: DEBUG_GRAPH_STATE
        value: "false"
      # LLM_PROVIDER ("anthropic" or "azure_openai") and the matching
      # credentials below are required - set them in the Render dashboard
      # (Environment tab); `sync: false` keeps them out of this committed
      # file.
      - key: LLM_PROVIDER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: "2025-04-01-preview"
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-5-mini
      # Entra ID sign-in for Power BI access - required for every /chat
      # call, not just Power BI-specific questions (see
      # data_analyst/clients/powerbi/auth.py's module docstring). This app
      # is a public client (PKCE, no client secret) - set ENTRA_REDIRECT_URI
      # to this service's public URL + /auth/callback (e.g.
      # https://data-analyst-assistant.onrender.com/auth/callback) and
      # register that same URI on the Entra ID app registration under the
      # "Mobile and desktop applications" platform - not "Web" (requires a
      # client secret) and not "Single-page application" either (Entra
      # requires an SPA redirect URI's code to be redeemed via a
      # cross-origin browser fetch(), which this server-side app isn't).
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_REDIRECT_URI
        sync: false
