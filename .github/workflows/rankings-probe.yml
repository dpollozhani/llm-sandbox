name: Rankings probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build rankings and commit
        run: |
          cd fifa-world-cup-dashboard
          python -c "import scrape; scrape.scrape_rankings()"
          cd ..
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fifa-world-cup-dashboard/data/rankings.json
          git commit -m "Add scraped rankings.json [skip ci]" || echo "no change"
          git push
