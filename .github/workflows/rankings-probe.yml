name: Rankings probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build rankings and show coverage
        run: |
          cd fifa-world-cup-dashboard
          python -c "import scrape; scrape.scrape_rankings()"
          echo "----------- data/rankings.json -----------"
          cat data/rankings.json
