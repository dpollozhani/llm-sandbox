[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-analyst-assistant"
version = "0.1.0"
description = "Simplified LangChain/LangGraph multi-agent data analyst assistant (Power BI + code sandbox, mocked)"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3",
    "langgraph>=1.2",
    "langchain-core>=1.5",
    "langchain-anthropic>=1.5",
    "langchain-openai>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "msal>=1.31",
    # <2.0: mcp 2.0.0 renamed streamable_http.streamablehttp_client to
    # streamable_http_client and dropped the old name - clients/powerbi/mcp.py
    # still imports the pre-2.0 name. There's no lock file (see deploy/docker/
    # Dockerfile's plain `pip install .`), so an unpinned upper bound here
    # breaks the next deploy the moment a new major mcp release ships.
    "mcp>=1.5,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data_analyst"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
