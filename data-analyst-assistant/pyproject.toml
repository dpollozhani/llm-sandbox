[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-analyst-assistant"
version = "0.1.0"
description = "Simplified LangChain/LangGraph multi-agent data analyst assistant (Power BI + code sandbox, mocked)"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3",
    "langgraph>=1.2",
    "langchain-core>=1.5",
    "langchain-anthropic>=1.5",
    "langchain-openai>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data_analyst"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
