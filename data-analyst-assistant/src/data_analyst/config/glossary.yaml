# Domain terms/concepts worth explaining to the model up front - an
# abbreviation, a business meaning behind a cryptically-named column, or a
# term that collides with a more common meaning - so it doesn't have to
# guess (or make the user re-explain) every conversation. Populate this
# with your own organization's terms; an empty or missing file is fine, it
# just means nothing gets injected.
terms:
  - term: BRIC
    definition: >-
      An item attribute that identifies the item independent of company/source system.
      Short fort Beijer Ref Item Code, not the BRIC/BRICS country grouping (Brazil, Russia, India, China,
      South Africa). Can be used to group by instead of/together with other item attributes and/or for filtering.
  - term: Company
    definition: >-
       The entity who does the sale to a customer, has the stock in a warehouse/facility, or receives the purchase from a supplier.
  - term: Branch
    definition: Refers to a facility/warehouse. 
     
    
