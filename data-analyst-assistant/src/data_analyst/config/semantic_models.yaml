# Maps a friendly model name (what the model uses in a DaxQuerySpec) to a
# real Power BI dataset id - populate this with your own tenant's values.
# `tables` is illustrative only; the real column/table schema comes from
# the live pbi_mcp_get_semantic_metadata call, not from here.
semantic_models:
  - model_name: Sales Analytics
    dataset_id: ds-001
    tables:
      - Sales
      - Products
      - Regions
